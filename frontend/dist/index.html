<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SentinelView</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar panel">
      <div class="brand">
        <h1>SentinelView</h1>
        <p>Transaction Risk Investigation Assistant</p>
      </div>
      <div id="customerList" class="customer-list"></div>
    </aside>

    <main class="workspace">
      <section class="panel controls">
        <div>
          <h2 id="customerTitle">Select a customer</h2>
          <p id="customerMeta" class="muted"></p>
        </div>
        <button id="investigateBtn" class="btn">Run Investigation</button>
      </section>

      <section class="panel timeline-panel">
        <h3>Transaction Timeline</h3>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="panel data-grid">
        <div class="transactions-panel">
          <h3>Transaction History</h3>
          <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="scanline"></div>
            <p>Investigating patterns…</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>Date</th><th>Payee</th><th>Amount</th><th>Channel</th><th>Category</th><th>Region</th>
                </tr>
              </thead>
              <tbody id="txBody"></tbody>
            </table>
          </div>
        </div>

        <div class="report-panel" id="reportPanel">
          <h3>Investigation Report</h3>
          <section id="firstFinding" class="report-section"></section>
          <section id="summary" class="report-section"></section>
          <section id="claims" class="report-section"></section>
          <section id="fallbackNotice" class="report-section"></section>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
